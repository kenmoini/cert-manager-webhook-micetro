name: PR Build Container - Cert-Manager Webhook for Micetro

env:
  BUILD_CONTEXT_PATH: .
  CONTAINERFILE_PATH: Dockerfile
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

on:
  pull_request:
    paths-ignore:
      - README.md
      - .github/dependabot.yml
      - .github/workflows/**
      - deploy/cert-manager-webhook-micetro/**
      - Makefile
      - OWNERS
      - renovate.json

jobs:
  test-and-dependency-submission:
    name: Run tests and submit dependencies for Golang
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Running Tests
        run: |
          go mod tidy
          make test

  # Build the container
  build:
    name: Build Container
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
    timeout-minutes: 360
    strategy:
      fail-fast: true
      matrix:
        platform:
          - linux/amd64
          # Since this is simply a PR integration test pipeline, we limit to just amd64
          # - linux/arm64
          # - linux/s390x
          # - linux/ppc64le
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check out code
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          context: ${{ env.BUILD_CONTEXT_PATH }}
          file: ${{ env.CONTAINERFILE_PATH }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
