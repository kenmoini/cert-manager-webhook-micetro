# Always run basic Golang linting
name: Go - Lint

permissions:
  contents: read

on:
  push:
    paths-ignore:
      - README.md
      - LICENSE
      - .github/dependabot.yml
      - .github/workflows/**
      - deploy/cert-manager-webhook-micetro/**
      - Dockerfile
      - Makefile
      - OWNERS
      - renovate.json
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
      - .github/dependabot.yml
      - .github/workflows/**
      - deploy/cert-manager-webhook-micetro/**
      - Dockerfile
      - Makefile
      - OWNERS
      - renovate.json

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint:
    name: Lint Golang code
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2