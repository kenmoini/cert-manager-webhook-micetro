name: Helm - Security Scan

on:
  push:
    paths:
      - 'deploy/cert-manager-webhook-micetro/**'
      - '.github/workflows/helm-scan.yaml'
  pull_request:
    paths:
      - 'deploy/cert-manager-webhook-micetro/**'
      - '.github/workflows/helm-scan.yaml'
  schedule:
    - cron: '0 0 * * 0'  # Weekly

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  kubesec:
    name: Kubesec Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Install kubesec
        run: |
          curl -LO https://github.com/controlplaneio/kubesec/releases/download/v2.14.2/kubesec_linux_amd64.tar.gz
          tar xzf kubesec_linux_amd64.tar.gz
          sudo mv kubesec /usr/local/bin/

      - name: Scan charts
        run: |
          for chart in deploy/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Scanning $chart"
              helm template test -n cert-manager "$chart" | kubesec scan -
            fi
          done

  checkov:
    name: Checkov Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Template charts
        run: |
          mkdir -p rendered
          for chart in deploy/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              name=$(basename "$chart")
              helm template test -n cert-manager "$chart" > rendered/${name}.yaml
            fi
          done

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: rendered/
          framework: kubernetes
          output_format: sarif
          output_file_path: checkov-results.sarif
          # CKV2_K8S_6: Minimize the admission of pods which lack an associated NetworkPolicy. (NetPols are available as an option.)
          # CKV_K8S_11: CPU limits should be set. (No they shouldn't)
          # CKV_K8S_43: Image should use digest (Releases get digests)
          # CKV_K8S_14: Image Tag should be fixed - not latest or blank (Releases use fixed tags)
          # CKV_K8S_40: Containers should run as a high UID to avoid host conflict (Container is using 1001 internally and OCP automatically reassigns the user to a higher UID)
          skip_check: CKV2_K8S_6,CKV_K8S_11,CKV_K8S_43,CKV_K8S_14,CKV_K8S_40

      # - name: Upload Checkov results
      #   uses: github/codeql-action/upload-sarif@v4
      #   if: always()
      #   with:
      #     sarif_file: checkov-results.sarif