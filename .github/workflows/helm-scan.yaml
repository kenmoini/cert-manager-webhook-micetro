name: Helm - Security Scan

on:
  push:
    paths:
      - 'deploy/cert-manager-webhook-micetro/**'
  pull_request:
    paths:
      - 'deploy/cert-manager-webhook-micetro/**'
  schedule:
    - cron: '0 0 * * 0'  # Weekly

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  kubesec:
    name: Kubesec Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Install kubesec
        run: |
          curl -LO https://github.com/controlplaneio/kubesec/releases/download/v2.14.2/kubesec_linux_amd64.tar.gz
          tar xzf kubesec_linux_amd64.tar.gz
          sudo mv kubesec /usr/local/bin/

      - name: Scan charts
        run: |
          for chart in deploy/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              echo "Scanning $chart"
              helm template test "$chart" | kubesec scan -
            fi
          done

  checkov:
    name: Checkov Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.4

      - name: Template charts
        run: |
          mkdir -p rendered
          for chart in deploy/*/; do
            if [ -f "$chart/Chart.yaml" ]; then
              name=$(basename "$chart")
              helm template test "$chart" > rendered/${name}.yaml
            fi
          done

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: rendered/
          framework: kubernetes
          output_format: sarif
          output_file_path: checkov-results.sarif

      # - name: Upload Checkov results
      #   uses: github/codeql-action/upload-sarif@v4
      #   if: always()
      #   with:
      #     sarif_file: checkov-results.sarif