---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-webhook-micetro
spec:
  destination:
    namespace: 'cert-manager'
    server: https://kubernetes.default.svc
  project: default
  sources:
    # In case you need to reference a Helm Values file, remove the curly braces and uncomment the following lines, then adjust the path accordingly.
    - helm: {}
      #  valueFiles:
      #    - $values/deploy/cert-manager-webhook-micetro/values.yaml
      repoURL: 'https://github.com/kenmoini/cert-manager-webhook-micetro'
      path: deploy/cert-manager-webhook-micetro
    # In case you need to reference a values.yaml file from the same repository as this ArgoCD Application, you can use the following syntax:
    #- ref: values
    #  repoURL: 'https://github.com/kenmoini/cert-manager-webhook-micetro'
    #  targetRevision: main
  syncPolicy:
    automated:
      allowEmpty: true
      selfHeal: true
      #prune: false
    syncOptions:
      - CreateNamespace=true