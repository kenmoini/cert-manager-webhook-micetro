---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager-webhook-micetro
spec:
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: appset/cert-manager-micetro
                    operator: In
                    values:
                      - enabled
                      - enable
                      - "true"
          - list:
              elements:
                - appName: cert-manager-webhook-micetro
                  helmRepoURL: 'https://github.com/kenmoini/cert-manager-webhook-micetro'
                  helmChartPath: 'deploy/cert-manager-webhook-micetro'
                  valuesRepo: 'https://github.com/kenmoini/cert-manager-webhook-micetro'
                  valuesPath: "$values/clusters/{{name}}/helm-values/vlanstacks.yaml"
  template:
    metadata:
      name: "{{name}}-{{appName}}"
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
    spec:
      project: default
      sources:
        - helm:
            valueFiles:
              - "{{valuesPath}}"
          path: '{{helmChartPath}}'
          repoURL: '{{helmRepoURL}}'
        - ref: values
          repoURL: '{{valuesRepo}}'
          targetRevision: HEAD
      destination:
        name: "{{name}}"
      syncPolicy:
        automated:
          prune: false
          allowEmpty: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: 5