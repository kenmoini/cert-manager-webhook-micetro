# The groupName avoids naming conflicts on the Kubernetes API, it should be set by the
# author of the webhook a unique domain that the author owns. For
# example: some-provider-webhook.mycompany.tld , or
# some-provider-webhook.mypersonalsite.tld if your webhook is a personal open-source
# project.
# Once set to a unique domain name by the webhook author, it does not need to be further
# adjusted by the users of a webhook chart!
# The name will need to be referenced in each Issuer's `webhook` stanza to
# inform cert-manager of where to send ChallengePayload resources in order to
# solve the DNS01 challenge.
groupName: acme.micetro.io

certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager

image:
  repository: ghcr.io/kenmoini/cert-manager-webhook-micetro
  tag: latest
  pullPolicy: Always

# -- Optional array of imagePullSecrets containing private registry credentials
imagePullSecrets: []
# - name: secretName

nameOverride: ""
fullnameOverride: ""
replicaCount: 1

service:
  type: ClusterIP
  port: 10250

resources:
  limits:
    memory: 128Mi
  requests:
    cpu: 150m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

priorityClassName: ""

# Enable or disable the creation of a NetworkPolicy for the cert-manager-webhook-micetro pod.
enableNetworkPolicy: false

# Security context for the cert-manager-webhook-micetro pod
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# Additional volumes to add to the cert-manager-webhook-micetro pod.
volumes: []

# Additional volume mounts to add to the cert-manager-webhook-micetro pod.
volumeMounts: []